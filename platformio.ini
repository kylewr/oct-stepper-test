; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = platformio.local.ini

[stepper]
build_flags =
    -D CORE_DEBUG_LEVEL=1
    ; All compile-time configuration lives here. Runtime pin changes made in
    ; the web UI override these hardware defaults in ESP32 Preferences.
    -D DEFAULT_AXIS_COUNT=4
    -D DEFAULT_ENABLE_PIN=10
    -D DEFAULT_ENABLE_ACTIVE_LOW=1
    -D DEFAULT_AXIS_1_STEP_PIN=3
    -D DEFAULT_AXIS_1_DIR_PIN=4
    -D DEFAULT_AXIS_2_STEP_PIN=5
    -D DEFAULT_AXIS_2_DIR_PIN=6
    -D DEFAULT_AXIS_3_STEP_PIN=7
    -D DEFAULT_AXIS_3_DIR_PIN=10
    -D DEFAULT_AXIS_4_STEP_PIN=0
    -D DEFAULT_AXIS_4_DIR_PIN=1
    -D MOTION_TIMER_HZ=50000
    -D MAX_STEP_RATE=5000
    -D TELEMETRY_PERIOD_MS=100
    -D WIFI_RETRY_MS=10000
    -D DEFAULT_STEPS_PER_REV=200
    -D DEFAULT_MAX_SPEED=1200
    -D DEFAULT_MAX_ACCELERATION=10000
    -D DEFAULT_SPEED=400
    -D DEFAULT_ACCELERATION=800
    -D DEFAULT_MOVE_STEPS=20
    -D DEFAULT_CYCLE_STEPS=200
    -D DEFAULT_DWELL_MS=250
    -D MOTION_BACKEND_UART=1
    -D BRIDGE_UART_BAUD=115200
    -D BRIDGE_TX_PIN=4
    -D BRIDGE_RX_PIN=5

[env:esp32-c3-devkitc-02]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitc-02
framework = arduino
monitor_speed = 115200
lib_deps =
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0
    bblanchon/ArduinoJson@7.4.3
build_flags =
    ${stepper.build_flags}
build_src_filter =
    +<*>
    -<uno_bridge/>

[env:arduino-uno-bridge]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags =
    -D BRIDGE_MAX_STEP_RATE=5000
build_src_filter =
    -<*>
    +<uno_bridge/>

[env:native]
platform = native
test_framework = unity
test_filter = test_motion
build_flags =
    -std=gnu++17

